name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/android.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check release version and tag
        run: python3 scripts/check_release.py
      - name: Restore protected signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64 secret'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fakegps-release.p12"
      - name: Build signed release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/fakegps-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --console=plain
      - name: Verify signature and prepare versioned files
        run: |
          version=$(sed -n 's/^versionName=//p' version.properties | tr -d '\r')
          mkdir -p dist
          apk="dist/FakeGPS-${version}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > dist/signature.txt
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' dist/signature.txt | tr '[:lower:]' '[:upper:]')
          expected=$(tr -d '[:space:]' < release-certificate.sha256)
          test "$actual" = "$expected" || { echo 'Release certificate does not match the pinned identity'; exit 1; }
          (cd dist && sha256sum "FakeGPS-${version}.apk" > SHA256SUMS.txt)
      - name: Upload signed release
        uses: actions/upload-artifact@v4
        with:
          name: fakegps-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "FakeGPS $RELEASE_TAG"
      - name: Remove signing key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/fakegps-release.p12"
